name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # runs typecheck first
      - run: npm test # includes manifest.json vs package.json drift (test/package.test.ts)
      # What npm would publish (built above, so skip prepack's second build).
      - run: npm pack --dry-run --ignore-scripts
      - run: npx mcpb validate manifest.json
      # The package as a stranger gets it: pack, install in a temp folder, --version, stdio handshake.
      - run: node scripts/test-pack.mjs
      # The MCP Bundle, built on Linux so esbuild's macOS binaries keep their executable bit.
      # Uploaded as a workflow artifact for testing (not a release).
      - run: node scripts/bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rendertrail-mcpb
          path: dist/rendertrail.mcpb
          if-no-files-found: error
      - name: Example app builds
        working-directory: examples/laggy-search
        run: npm ci && npm run build

  golden:
    name: Golden tests (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.3.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The recorder bundles the React in node_modules. The lockfile has 19.3.1 (also used by the
      # card); other versions replace it for this job only, without touching package.json.
      - name: Install React ${{ matrix.react }}
        if: matrix.react != '19.3.1'
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
      # playwright-core's own CLI installs the Chromium build that matches its version. The recorder
      # tries the installed Chrome first and falls back to this.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:golden
        env:
          EXPECT_REACT_VERSION: ${{ matrix.react }}
